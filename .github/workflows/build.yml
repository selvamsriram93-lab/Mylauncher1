name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q "$(ls *.zip | head -1)" -d proj
          echo "PROJ=$(dirname "$(find proj -name settings.gradle.kts | head -1)")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - run: gradle -p "$PROJ" assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
